advisor:
  enabled: true
  backend: ollama # auto | anthropic | ollama | council | deterministic | nim | llamacpp
  min_confidence_default: 0.6
  fallback_to_deterministic: true
  prompt_version: 2026-04-26.enterprise.v1
  primary_model: claude-sonnet-4-20250514
  fallback_models:
    - deterministic-local
  response_validator: strict-allowed-action

ollama:
  enabled: true
  host: http://127.0.0.1:11434
  model: qwen3.8:27b
  timeout: 300 # 27B model needs headroom for cold-load + inference
  temperature: 0.1
  keep_alive: 10m
  format: json   # constrain output to valid JSON
  think: false   # Qwen3 is a reasoning model; disable thinking for fast structured output

llamacpp:
  enabled: true
  # llama.cpp server (OpenAI-compatible endpoint). base_url may omit the /v1 suffix.
  base_url: http://127.0.0.1:8081
  model: unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL
  api_key: sk-local # llama.cpp ignores the value but the OpenAI client requires one
  temperature: 0.1
  max_tokens: 2048 # Qwen3 is a reasoning model; leave headroom past the thinking phase
  timeout: 120

nim:
  enabled: true
  model: meta/llama-3.1-70b-instruct
  temperature: 0.1
  max_tokens: 1024
  timeout: 60
  # Available models:
  # meta/llama-3.1-70b-instruct
  # meta/llama-3.1-8b-instruct
  # nvidia/llama-3.1-nemotron-70b-instruct
  # mistralai/mixtral-8x7b-instruct-v0.1
